name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Plugin entry point works without install
        run: |
          ./bin/harness --version
          ./bin/harness policy validate
          echo '{"session_id":"ci","cwd":"'"$PWD"'","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"rm -rf ~"}}' \
            | ./bin/harness hook PreToolUse | grep -q '"permissionDecision": "deny"'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/*.json hooks/hooks.json .claude/settings.json src/agentharness/defaults/policy.json examples/*.json; do
            python -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: Plugin paths exist
        run: |
          python - <<'PY'
          import json, os, sys
          m = json.load(open(".claude-plugin/plugin.json"))
          missing = [p for p in m.get("agents", []) + m.get("skills", []) if not os.path.exists(p)]
          sys.exit(f"missing: {missing}" if missing else 0)
          PY
      - name: No secrets in the source tree
        run: ./bin/harness scan --high-only src hooks bin .claude-plugin docs examples
      - name: Build and install the wheel
        run: |
          pip install build
          python -m build
          pip install dist/*.whl
          cd "$(mktemp -d)" && git init -q
          harness init --profile standard
          harness doctor
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
