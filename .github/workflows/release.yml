name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions agree with the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "version = \"$tag\"" pyproject.toml
          grep -q "__version__ = \"$tag\"" src/agentharness/__init__.py
          grep -q "\"version\": \"$tag\"" .claude-plugin/plugin.json
      - run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          python -m unittest discover -s tests -q
      - run: pip install build && python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$notes"
