[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "1.0.0"
description = "Guardrails, memory and verification for Claude Code agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "priveight02" }]
keywords = ["claude-code", "ai-agents", "guardrails", "hooks", "llm", "security"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "coverage>=7", "build>=1"]

[project.scripts]
harness = "agentharness.cli:main"

[project.urls]
Repository = "https://github.com/priveight02/agent-harness"
Changelog = "https://github.com/priveight02/agent-harness/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentharness = ["defaults/*.json", "templates/*.md", "templates/agents/*.md", "templates/skills/*/SKILL.md"]

[tool.ruff]
line-length = 140
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S602", # shell=True is the point: hooks run the user's configured commands
  "S603",
  "S607",
  "S101",
  "UP006", "UP007", "UP035", "UP037", "UP045", # keep typing.List / Optional for 3.9
  "E501", # the formatter owns line length; long strings stay readable
  "SIM102", "SIM103", "SIM105", "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "I001"] # helpers must be imported first: it sets sys.path

[tool.coverage.run]
source = ["agentharness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
