[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-pro-max"
version = "2.1.0"
description = "Claude Code Harness Pro Max: guardrails, token and cost control, multi-agent orchestration and verification for Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "priveight02" }]
keywords = ["claude-code", "ai-agents", "guardrails", "hooks", "llm", "security", "cost", "tokens", "subagents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "coverage>=7", "build>=1"]

[project.scripts]
harness = "harnesspro.cli:main"

[project.urls]
Repository = "https://github.com/priveight02/claude-code-harness-pro-max"
Changelog = "https://github.com/priveight02/claude-code-harness-pro-max/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src", "harnesspro.bundled_skills" = "skills", "harnesspro.bundled_agents" = "agents" }
packages = ["harnesspro", "harnesspro.bundled_skills", "harnesspro.bundled_agents"]

[tool.setuptools.package-data]
harnesspro = ["defaults/*.json", "templates/*.md"]
"harnesspro.bundled_skills" = ["*/*.md", "*/*/*.md"]
"harnesspro.bundled_agents" = ["*.md"]

[tool.ruff]
line-length = 140
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S602",
  "S603",
  "S607",
  "S101",
  "S310",
  "UP006", "UP007", "UP035", "UP037", "UP045",
  "E501",
  "SIM102", "SIM103", "SIM105", "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "I001"]

[tool.coverage.run]
source = ["harnesspro"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
